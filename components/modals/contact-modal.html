<!-- Contact Modal -->
<div id="contact-modal" class="modal-enter fixed inset-0 z-[2000] flex items-center justify-center bg-azul-noche/60 backdrop-blur-sm p-4">
    <div class="relative bg-gradient-to-b from-[#052032] to-[#0b2130] rounded-2xl p-6 sm:p-8 w-full max-w-lg shadow-2xl border border-white/10">
        <button id="modal-close" aria-label="Cerrar modal" class="absolute top-4 right-4 text-texto-claro text-2xl hover:text-ice-acento transition-colors w-8 h-8 flex items-center justify-center rounded-lg bg-white/5">
            &times;
        </button>
        <h3 class="font-heading text-xl sm:text-2xl font-bold text-ice-acento mb-2">Consulta Rápida</h3>
        <p class="font-body text-xs sm:text-sm text-slate-300 mb-6">
            Déjanos tu mensaje y te responderemos directamente por correo electrónico.
        </p>
        
        <form id="modal-contact-form" class="space-y-4 font-body">
            <div>
                <label for="modal-nombre" class="block text-xs font-semibold text-[#cfe9fb] mb-1">Nombre Completo</label>
                <input id="modal-nombre" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-texto-claro focus:outline-none focus:ring-2 focus:ring-teal-acento text-sm" placeholder="Tu nombre" required>
            </div>
            <div>
                <label for="modal-email" class="block text-xs font-semibold text-[#cfe9fb] mb-1">Email de Contacto</label>
                <input id="modal-email" type="email" class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-texto-claro focus:outline-none focus:ring-2 focus:ring-teal-acento text-sm" placeholder="tu@email.com" required>
            </div>
            <div>
                <label for="modal-mensaje" class="block text-xs font-semibold text-[#cfe9fb] mb-1">Mensaje</label>
                <textarea id="modal-mensaje" rows="4" class="w-full px-3.5 py-2.5 rounded-lg bg-white/5 border border-white/10 text-texto-claro focus:outline-none focus:ring-2 focus:ring-teal-acento text-sm resize-none" placeholder="Tu consulta..." required></textarea>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button type="button" id="modal-cancel" class="px-4 py-2.5 rounded-xl text-sm font-medium text-texto-claro hover:bg-white/10 transition-colors">Cancelar</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-teal-acento text-azul-noche hover:bg-teal-acento/90 transition-colors shadow-md">Enviar Consulta</button>
            </div>
        </form>
    </div>
</div>
