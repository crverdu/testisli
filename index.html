<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Meta tags SEO -->
    <title>Instituto Superior La Inmaculada | ISLI - Educación Superior en Apóstoles, Misiones</title>
    <meta name="description" content="Instituto Superior La Inmaculada (ISLI) en Apóstoles, Misiones. 85 años de excelencia educativa. Oferta académica: Profesorado en Educación Especial y Tecnicatura Superior en Gastronomía con validez nacional.">
    <meta name="keywords" content="ISLI, Instituto Superior La Inmaculada, Apóstoles Misiones, Profesorado Educación Especial, Tecnicatura Gastronomía, educación superior Misiones, carreras terciarias, inscripciones 2026">
    <meta name="author" content="Instituto Superior La Inmaculada">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Instituto Superior La Inmaculada | ISLI - 85 Años de Historia">
    <meta property="og:description" content="Formación Superior con Valor Humano y Excelencia Académica en Apóstoles, Misiones. Profesorado en Educación Especial y Tecnicatura en Gastronomía.">
    <meta property="og:image" content="assets/icons/logo.svg">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">

    <!-- Google Fonts: Montserrat (Títulos) y Roboto (Cuerpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config con paleta de color de acento y tipografías -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'azul-noche': '#0F172A',
                        'azul-noche-oscuro': '#071226',
                        'teal-acento': '#0EA5A4',
                        'ice-acento': '#93C5FD',
                        'blanco-fondo': '#F8FAFC',
                        'texto-oscuro': '#1F2937',
                        'texto-claro': '#E6F2FA',
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Roboto', 'sans-serif'],
                        sans: ['Roboto', 'Segoe UI', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="bg-blanco-fondo text-texto-oscuro antialiased font-body">

    <!-- Header Component -->
    <div id="header-component"></div>

    <!-- Main Content Component -->
    <div id="main-content-component"></div>

    <!-- Footer Component -->
    <div id="footer-component"></div>

    <!-- Modal Component -->
    <div id="contact-modal-component"></div>

    <!-- Script principal de la aplicación -->
    <script src="script.js"></script>
    <script>
        // Carga modular de componentes HTML reutilizables
        document.addEventListener('DOMContentLoaded', function() {
            Promise.all([
                fetch('components/header.html').then(res => {
                    if (!res.ok) throw new Error('Error al cargar header');
                    return res.text();
                }),
                fetch('components/main-content.html').then(res => {
                    if (!res.ok) throw new Error('Error al cargar main-content');
                    return res.text();
                }),
                fetch('components/footer.html').then(res => {
                    if (!res.ok) throw new Error('Error al cargar footer');
                    return res.text();
                }),
                fetch('components/modals/contact-modal.html').then(res => {
                    if (!res.ok) throw new Error('Error al cargar modal');
                    return res.text();
                })
            ]).then(([headerData, mainData, footerData, modalData]) => {
                document.getElementById('header-component').innerHTML = headerData;
                document.getElementById('main-content-component').innerHTML = mainData;
                document.getElementById('footer-component').innerHTML = footerData;
                document.getElementById('contact-modal-component').innerHTML = modalData;

                // Cargar subsecciones modulares del main content
                return Promise.all([
                    fetch('components/sections/hero-nosotros.html').then(res => res.text()),
                    fetch('components/sections/programas.html').then(res => res.text()),
                    fetch('components/sections/redes-cta.html').then(res => res.text()),
                    fetch('components/sections/contacto.html').then(res => res.text())
                ]);
            }).then(([heroNosotros, programas, redesCta, contacto]) => {
                const sHero = document.getElementById('section-hero-nosotros');
                const sProg = document.getElementById('section-programas');
                const sRedes = document.getElementById('section-redes-cta');
                const sCont = document.getElementById('section-contacto');

                if (sHero) sHero.innerHTML = heroNosotros;
                if (sProg) sProg.innerHTML = programas;
                if (sRedes) sRedes.innerHTML = redesCta;
                if (sCont) sCont.innerHTML = contacto;

                // Inicializar eventos de interacción tras cargar todo el DOM dinámico
                if (typeof window.initAppInteractions === 'function') {
                    window.initAppInteractions();
                }
            }).catch(error => {
                console.error('Error cargando componentes:', error);
                if (window.location.protocol === 'file:') {
                    console.warn('CORS restringido: Para ver los componentes localmente debes usar un servidor web local (ej. Live Server, npx serve o python -m http.server).');
                }
            });
        });
    </script>
</body>
</html>
