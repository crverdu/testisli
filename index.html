<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISLI | 85 años</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Component -->
    <div id="header-component"></div>

    <!-- Main Content Component -->
    <main id="main-content-component"></main>

    <!-- Footer Component -->
    <div id="footer-component"></div>

    <script src="script.js"></script>
    <script>
        // Component Loader
        document.addEventListener('DOMContentLoaded', function() {
            // Load Header
            fetch('components/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-component').innerHTML = data;
                })
                .catch(error => console.error('Error loading header:', error));

            // Load Main Content
            fetch('components/main-content.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('main-content-component').innerHTML = data;
                })
                .catch(error => console.error('Error loading main content:', error));

            // Load Footer
            fetch('components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-component').innerHTML = data;
                })
                .catch(error => console.error('Error loading footer:', error));
        });
    </script>
</body>
</html>
